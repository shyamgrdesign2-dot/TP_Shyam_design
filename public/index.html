    <!-- Build release identity, substituted into build/index.html by CI AFTER the webpack
         build (see .github/workflows/*, "Stamp the release"). Deliberately not a
         REACT_APP_* var: those land in env.raw, which is webpack's cache.version
         (react-scripts config/env.js:72, config/webpack.config.js:244), so a per-commit
         release string invalidates the entire filesystem cache on every deploy.
         See docs/build-time-optimisation-plan.md §9.1.
         Substituting after the build also keeps the value out of every webpack module,
         so a warm cache can never serve a stale release.
         Left as the literal placeholder in local dev, where CI never runs.
         The placeholder is %%APP_RELEASE%%, NOT __APP_RELEASE__: the property name on
         this same line contains __APP_RELEASE__, and a global substitution on that
         token rewrites the property name too, producing invalid JS. That shipped once
         and silently blanked the release everywhere. -->
    <script>window.__APP_RELEASE__ = "%%APP_RELEASE%%";</script>

<!-- Only load Beamer if NOT a receptionist -->
<script>
    if (!isReceptionist && !isScannerPage) {
        const loadBeamer = () => {
            const beamerScript = document.createElement('script');
            beamerScript.type = "text/javascript";
            beamerScript.src = "https://app.getbeamer.com/js/beamer-embed.js";
            beamerScript.defer = true;
            beamerScript.async = true;
            document.body.appendChild(beamerScript);
        };
        if ('requestIdleCallback' in window) {
            requestIdleCallback(loadBeamer);
        } else {
            window.addEventListener('load', loadBeamer);
        }
    }
</script>

<script>
    // Only load Razorpay script if NOT a receptionist
    if (!isReceptionist && !isScannerPage) {
        const loadRazorpay = () => {
            const script = document.createElement('script');
            script.src = 'https://checkout.razorpay.com/v1/checkout.js';
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        };
        if ('requestIdleCallback' in window) {
            requestIdleCallback(loadRazorpay);
        } else {
            window.addEventListener('load', loadRazorpay);
        }
    }
</script>
