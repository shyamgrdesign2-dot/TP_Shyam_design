name: Trigger auto deployment for pm-prod-doctor-portal

on:
  push:
    branches:
      [ prod ]
    paths:
    - '**'
    - '.github/workflows/pm-prod-doctor-portal-AutoDeployTrigger-3f2aba67-98a9-4e87-b2ab-44914b2c674a.yml'

  workflow_dispatch:

concurrency:
  group: pm-prod-doctor-portal
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Webpack minification is CPU-parallel and this build runs with an 8GB heap
    # (see Dockerfile NODE_OPTIONS), so more cores + RAM directly cuts the 356s compile.
    # Switchable WITHOUT a code change: set repo variable PROD_RUNNER
    # (Settings -> Secrets and variables -> Actions -> Variables) to a provisioned
    # larger-runner label, e.g. ubuntu-latest-8-cores. Clearing the variable reverts.
    # Do NOT hardcode a label here: an unprovisioned label leaves the job queued
    # forever rather than failing loudly.
    runs-on: ${{ vars.PROD_RUNNER || 'ubuntu-latest' }}

    env:
      REACT_APP_ENV: prod
      # Upload → blob container react-static-prod/cdn/... Front Door exposes that at the root (/).
      PUBLIC_URL_PROD_CDN: https://assets.tatvacare.in/
      IMAGE_NAME: acinacr.azurecr.io/pm-prod-doctor-portal:${{ github.sha }}
      # Sentry release naming: <package>@<semver>+<sha>. The package prefix makes Sentry
      # parse it as semver (sortable, `release:latest` works); +sha is semver build
      # metadata pinning the exact commit.
      RELEASE_PACKAGE: pm-doctor-portal
      SENTRY_ORG: digicare-health-solutions-priv
      SENTRY_PROJECT: tatvapractice

    permissions:
      id-token: write
      contents: write   # push the vX.Y.Z release tag

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4
        with:
          # Full history + tags: needed by the duplicate-tag guard below and by
          # `sentry-cli releases set-commits --auto` (suspect commits).
          fetch-depth: 0

      # ---- 0. Resolve this deploy's release identity ----
      # This single string is the source of truth. It is baked into the JS bundle,
      # used for the sourcemap upload, and used for every sentry-cli call. If the
      # three ever differ, Sentry silently fails to symbolicate.
      - name: Resolve release version
        id: release
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)

          # Bookkeeping must never block a deploy. Both checks below only decide whether
          # this commit earns a git tag; neither stops the release from shipping.
          #
          # Sentry releases stay unique regardless, because the release string carries
          # +<sha>. Only the git TAG can collide, and a duplicate tag is not worth a
          # failed deploy — especially with ~74 open PRs whose authors have no reason to
          # know a tagging convention was introduced.
          TAG_EXISTS=0

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::package.json version '$VERSION' is not X.Y.Z — deploying without a git tag. Set a semver version to get a tagged release."
            TAG_EXISTS=1
          elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if [ "$(git rev-list -n 1 "refs/tags/v$VERSION")" = "$(git rev-parse HEAD)" ]; then
              # Same commit: a workflow_dispatch re-run, or a retry after a late step failed.
              echo "::notice::re-deploying v$VERSION — tag already points at this commit"
            else
              echo "::warning::tag v$VERSION already exists on a different commit — deploying without a new tag. Bump \"version\" in package.json to get a tagged release for this change."
            fi
            TAG_EXISTS=1
          fi

          {
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "release=${RELEASE_PACKAGE}@${VERSION}+${SHA}"
            echo "tag_exists=$TAG_EXISTS"
          } >> "$GITHUB_OUTPUT"
          echo "Release: ${RELEASE_PACKAGE}@${VERSION}+${SHA}"

      # ---- 1. Build image and push to ACR (no Container App update yet) ----
      # Generate version.json here in CI where git is guaranteed to be available.
      # Do NOT rely on generate-version.js running inside the Docker build —
      # .dockerignore typically excludes .git so git rev-parse would silently fail there.
      # This file is baked into the image but intentionally excluded from blob upload below.
      - name: Generate version.json
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          API_VERSION=$(node -e "console.log(require('./package.json').apiCompatibilityVersion ?? 1)")
          # `release` is informational (ops can curl /version.json to see what is live).
          # `apiVersion` stays the ONLY force-reload trigger — a routine semver bump must
          # not hard-refresh every doctor mid-consult. See src/hooks/useVersionCheck.js.
          RELEASE="${{ steps.release.outputs.release }}"
          echo "{\"version\":\"$SHA\",\"apiVersion\":$API_VERSION,\"release\":\"$RELEASE\"}" > public/version.json

      # The build runs on the runner, not inside Docker. Ported from uat (#3956, #3957)
      # after it proved out there. docs/build-time-optimisation-plan.md §8.
      #
      # This supersedes the buildx layer cache that was tried and measurably lost
      # (#3944, reverted in #3953): run 32177103750 spent 416.7s exporting cache for
      # 0 CACHED layers, +5m15s on the deploy. That failed because it moved multi-GB
      # layers to save ~126s. This moves a 99 MB babel-loader cache to save ~120s, and
      # the ~/.npm cache on top. The note left on that revert — "revisit with a different
      # approach, e.g. caching node_modules on the runner via actions/cache, outside the
      # image" — is exactly this.
      #
      # Measured on uat: deploy 717s -> 481s once the cache is warm. The FIRST deploy
      # after this merges is cold and will land near today's timing.
      #
      # GENERATE_SOURCEMAP stays false: generating + uploading ~103MB of maps added an
      # estimated 3-6 min to a deploy already dominated by the webpack compile. Release
      # ATTRIBUTION does not need sourcemaps — `release` is event metadata, so "first seen
      # in vX.Y.Z", regressions and release health all still work.

      # Node 20 to match the `node:20` image the build used to run in.
      # cache: 'npm' caches ~/.npm — the npm cache, not node_modules. Worth 85s on uat.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 99 MB measured (run 32186452054), so restore and save cost seconds against the
      # ~120s of compile it saves. Keyed on the lockfile so a dependency change starts
      # clean; the sha makes each deploy write its own entry, and restore-keys fall back
      # to the most recent compatible one.
      #
      # Holds BOTH caches: babel-loader (~99 MB on disk) and webpack's own pack cache
      # (~967 MB on disk), which PERSIST_WEBPACK_CACHE in the build step makes real. The
      # entry is ~157 MB compressed — actions/cache zstd-compresses it and webpack pack
      # files compress about 7:1. Measured save 6s, restore 12s (run 32219922816).
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-craco-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-craco-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-craco-

      # This branch's committed .npmrc carries a ${NODE_AUTH_TOKEN} placeholder, so
      # setting the env var alone would work here — but the uat branch's .npmrc does not,
      # and assuming prod's convention on uat is what broke the first attempt there
      # (#3957). Writing the auth line explicitly works against either form, so the two
      # pipelines cannot drift apart again.
      #
      # It goes to the runner's user-level ~/.npmrc, never the repo's committed .npmrc —
      # a token in the working tree is one `git add -A` from being pushed.
      - name: Authenticate npm to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::GH_PACKAGES_TOKEN is empty — @dhspl-tatvacare packages cannot be installed"
            exit 1
          fi
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> ~/.npmrc

      # `npm install --legacy-peer-deps`, not `npm ci`, to match what the Dockerfile did.
      # package-lock.json has not been verified as in sync; switching is a separate change.
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps

      # Mirrors the env the Dockerfile build stage set. Two that matter:
      #   CI=false          — Actions sets CI=true, which makes CRA treat warnings as
      #                       errors, and this repo builds with pre-existing warnings.
      #
      # REACT_APP_SENTRY_RELEASE is deliberately NOT set. Every REACT_APP_* var lands in
      # env.raw, which is webpack's cache.version, so a per-commit release string
      # invalidated the entire filesystem cache on every deploy. The release is stamped
      # into build/index.html after the build instead — see the next step and plan §9.1.
      # SENTRY_RELEASE stays, because sentry-cli still needs it for the sourcemap upload,
      # and both derive from the same value so they cannot drift.
      - name: Build
        env:
          REACT_APP_ENV: prod
          GENERATE_SOURCEMAP: 'false'
          PUBLIC_URL: ${{ env.PUBLIC_URL_PROD_CDN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.release.outputs.release }}
          NODE_OPTIONS: --max-old-space-size=8192
          DISABLE_ESLINT_PLUGIN: 'true'
          CI: 'false'
          # Makes craco close the webpack compiler after the build, which is the only
          # reason webpack's `store: 'pack'` cache is flushed at all —
          # react-scripts/scripts/build.js calls compiler.run() and never
          # compiler.close(), so the cache configured at webpack.config.js:242 has never
          # been written in this repo. See craco.config.js and plan §4, §9.1.
          #
          # This only pays off because the release is no longer a REACT_APP_* var.
          # cache.version is md5(env.raw) and env.raw carries every REACT_APP_*, so a
          # per-commit release string invalidated the entire pack on every deploy.
          # Reintroducing ANY per-commit REACT_APP_* var silently reverts this to a cold
          # build every time — no error, the saving just quietly disappears.
          PERSIST_WEBPACK_CACHE: '1'
        run: |
          set -euo pipefail
          npm run build
          # `npm run build` uploads the sourcemaps to Sentry as its last step. Drop them
          # afterwards so they reach neither the image nor the CDN — same as the
          # Dockerfile's `find /app/build -name "*.map" -delete`.
          find build -name '*.map' -type f -delete

      # Substituted AFTER the webpack build, on purpose. The release changes every
      # commit; putting it anywhere webpack can see would either invalidate the entire
      # filesystem cache (as REACT_APP_SENTRY_RELEASE did) or let a warm cache serve a
      # stale value from a cached module — which fails silently, with Sentry attributing
      # new errors to the previous deploy. index.html is regenerated every build, served
      # no-store by nginx, and excluded from the blob upload, so it is the one place a
      # per-deploy value can live safely.
      #
      # Only index.html is touched. The token also appears in the JS bundle, as the
      # literal appVersion.js compares against for local dev; rewriting it there would
      # break that check.
      - name: Stamp the release into index.html
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          if ! grep -q '%%APP_RELEASE%%' build/index.html; then
            echo "::error::build/index.html has no %%APP_RELEASE%% placeholder — public/index.html lost it, or the build did not regenerate index.html. Sentry would report no release."
            exit 1
          fi
          # The release string is [A-Za-z0-9@.+-] only, so | is a safe delimiter.
          sed -i "s|%%APP_RELEASE%%|${RELEASE}|g" build/index.html
          if grep -q '%%APP_RELEASE%%' build/index.html; then
            echo "::error::placeholder survived substitution in build/index.html"
            exit 1
          fi
          # THE check. An earlier version used __APP_RELEASE__ as the placeholder, which
          # also appears as the property name on the same line, so a global substitution
          # rewrote `window.__APP_RELEASE__ =` into `window.pm-doctor-portal@sha =` —
          # invalid JS, script never runs, release silently empty. Every other check here
          # passed on that build. Fixed on uat in #3963.
          if ! grep -q 'window\.__APP_RELEASE__' build/index.html; then
            echo "::error::the window.__APP_RELEASE__ assignment is gone from build/index.html — substitution clobbered the property name, and the release would be silently empty at runtime"
            exit 1
          fi
          if ! grep -qF "$RELEASE" build/index.html; then
            echo "::error::release '$RELEASE' is not present in build/index.html after substitution"
            exit 1
          fi
          echo "Stamped release: $RELEASE"

      - name: Docker login to ACR
        env:
          REGISTRY_USER: ${{ secrets.PMPRODDOCTORPORTAL_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.PMPRODDOCTORPORTAL_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_PASS" | docker login acinacr.azurecr.io -u "$REGISTRY_USER" --password-stdin

      # Dockerfile.runtime is nginx + COPY build/. Its context is trimmed to build/ and
      # nginx.conf by Dockerfile.runtime.dockerignore, which BuildKit uses in preference
      # to .dockerignore — hence DOCKER_BUILDKIT=1 being explicit rather than assumed.
      - name: Build and push the runtime image
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          docker build -f Dockerfile.runtime -t "${{ env.IMAGE_NAME }}" .
          docker push "${{ env.IMAGE_NAME }}"

      # ---- 2. Stage the blob payload ----
      # This used to pull the files back out of the pushed image with docker create/cp.
      # The build output is already on disk now, so it is a copy.
      - name: Stage built assets (html minus index.html and version.json)
        run: |
          set -euo pipefail
          rm -rf _blob_html
          cp -r build _blob_html
          # index.html and version.json must only be served from the container (nginx),
          # never from blob/CDN — both need no-cache guarantees that blob cannot provide.
          rm -f _blob_html/index.html
          rm -f _blob_html/version.json

      # ---- 3. Upload to blob BEFORE the Container App revision switch ----
      # PMPRODDOCTORPORTAL_BLOB_UPLOAD_CREDENTIALS — JSON for azure/login `creds` (clientId, clientSecret,
      # subscriptionId, tenantId). subscriptionId must contain pmdoctorportal storage account.
      # RBAC: Storage Blob Data Contributor on pmdoctorportal (or scoped to react-static-prod).
      - name: Azure Login (blob upload identity)
        uses: azure/login@v1
        with:
         creds: ${{ secrets.PMPRODDOCTORPORTAL_BLOB_UPLOAD_CREDENTIALS }}
         #client-id: ${{ secrets.PMPRODDOCTORPORTAL_AZURE_CLIENT_ID }}
         #tenant-id: ${{ secrets.PMPRODDOCTORPORTAL_AZURE_TENANT_ID }}
         #subscription-id: ${{ secrets.PMPRODDOCTORPORTAL_AZURE_SUBSCRIPTION_ID }}

      # azcopy instead of `az storage blob upload-batch`. Proven on UAT first
      # (run 32177197271): 471 files scanned, 15 uploaded, 10.8s versus ~109s here.
      # The gain is twofold — azcopy parallelises properly, and sync skips files whose
      # content is unchanged, which is most of a content-hashed build.
      #
      # The risk this carries is that azcopy writes Content-Type on every blob it uploads.
      # If it inferred those differently from `az`, the upload would still SUCCEED and the
      # site would then serve .js with a type browsers refuse to execute, with nothing in
      # the logs to explain it. The gate below turns that into a failed build instead.
      # On UAT the newly built main.<hash>.js and main.<hash>.css came back as
      # application/javascript and text/css.
      #
      # --compare-hash=MD5 is required, not an optimisation: sync compares last-modified
      # time by default, and every file gets a fresh mtime from the rebuilt image, so the
      # default would re-upload everything and save nothing.
      # --delete-destination=false preserves the previous behaviour, keeping blobs absent
      # from the source so chunks used by the live revision survive.
      - name: Publish build assets to Azure Blob (react-static-prod/cdn)
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
        run: |
          set -euo pipefail
          if ! command -v azcopy >/dev/null 2>&1; then
            echo "azcopy not preinstalled — fetching"
            curl -sL https://aka.ms/downloadazcopy-v10-linux -o /tmp/azcopy.tgz
            tar -xzf /tmp/azcopy.tgz -C /tmp
            sudo install -m 755 /tmp/azcopy_linux_amd64_*/azcopy /usr/local/bin/azcopy
          fi
          azcopy --version

          time azcopy sync "_blob_html" \
            "https://pmdoctorportal.blob.core.windows.net/react-static-prod/cdn" \
            --recursive \
            --delete-destination=false \
            --compare-hash=MD5 \
            --put-md5 | tee /tmp/azcopy.out

          # Only files azcopy actually uploaded say anything about how azcopy behaves.
          TRANSFERRED=$(grep -oE 'Total Number of Copy Transfers: [0-9]+' /tmp/azcopy.out | grep -oE '[0-9]+$' || echo 0)
          echo "TRANSFERRED=$TRANSFERRED" >> "$GITHUB_ENV"
          echo "azcopy uploaded $TRANSFERRED file(s)"

      # Reads Content-Type back from the blob itself (not through the CDN, which could
      # return a cached value) and fails the build on any mismatch — BEFORE the Container
      # App switch, so prod keeps serving the previous revision if azcopy got this wrong.
      #
      # Samples ONLY from static/, deliberately: those filenames are content-hashed, so a
      # changed build always produces new names azcopy must upload, which means the check
      # actually exercises azcopy. Sampling unchanged public/ files would read back
      # metadata `az` set on an earlier deploy and pass even if azcopy were broken.
      - name: Verify Content-Type survived the upload
        run: |
          set -euo pipefail
          if [ "${TRANSFERRED:-0}" -eq 0 ]; then
            echo "::warning::azcopy uploaded 0 files, so nothing here exercises it. Content-Type unverified this run; existing blobs keep their previous metadata."
            exit 0
          fi

          check() {
            local rel="$1" want="$2"
            [ -n "$rel" ] || { echo "  (no sample under static/ for $want — skipped)"; return 0; }
            local got
            got=$(az storage blob show \
              --account-name pmdoctorportal --auth-mode login \
              --container-name react-static-prod --name "cdn/$rel" \
              --query "properties.contentSettings.contentType" -o tsv)
            printf '  %-52s %s\n' "$rel" "$got"
            if [ "$got" != "$want" ]; then
              echo "::error::Content-Type mismatch for $rel — expected '$want', blob has '$got'. Revert this step to az storage blob upload-batch."
              exit 1
            fi
          }

          cd _blob_html
          check "$(find static/js  -name '*.js'  -type f 2>/dev/null | head -1)" "application/javascript"
          check "$(find static/css -name '*.css' -type f 2>/dev/null | head -1)" "text/css"
          check "$(find static/media -name '*.svg'   -type f 2>/dev/null | head -1)" "image/svg+xml"
          check "$(find static/media -name '*.png'   -type f 2>/dev/null | head -1)" "image/png"
          check "$(find static/media -name '*.woff2' -type f 2>/dev/null | head -1)" "font/woff2"
          echo "Content-Type preserved on every sampled type that azcopy uploaded."

      # ---- 4. Now switch the Container App to the new image (assets already in place) ----
      - name: Azure Login (deploy identity)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.PMPRODDOCTORPORTAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PMPRODDOCTORPORTAL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PMPRODDOCTORPORTAL_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App revision
        run: |
          set -euo pipefail
          az containerapp update \
            --name pm-prod-doctor-portal \
            --resource-group tatva-prod \
            --image "${{ env.IMAGE_NAME }}"

      # ---- 5. Register the release in Sentry ----
      # Runs after the deploy so the deploy timestamp is truthful. The release itself
      # already exists (the sourcemap upload created it); `releases new` is idempotent.
      - name: Finalize Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          CLI="npx --yes @sentry/cli@2"

          $CLI releases new "$RELEASE"

          # Suspect Commits + "issue regressed in release X". Requires the GitHub
          # integration to be enabled for the Sentry org; kept non-fatal so a missing
          # integration never blocks an already-live prod deploy.
          $CLI releases set-commits "$RELEASE" --auto \
            || echo "::warning::sentry set-commits failed — enable the GitHub integration in Sentry for suspect commits"

          $CLI releases finalize "$RELEASE"
          $CLI releases deploys new -r "$RELEASE" -e prod

      # ---- 6. Tag the commit so the deployed version is recoverable from git ----
      - name: Tag release
        if: steps.release.outputs.tag_exists == '0'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$RELEASE"
          git push origin "v$VERSION"
