name: Trigger auto deployment for pm-preprod-doctor-portal

on:
  push:
    branches: 
      - preprod
    paths:
      - '**'
      - '.github/workflows/pm-preprod-doctor-portal-AutoDeployTrigger-5ba63814-682f-4a65-b4a3-eea0f616e293.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      REACT_APP_ENV: prod

    permissions: 
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PMPREPRODDOCTORPORTAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PMPREPRODDOCTORPORTAL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PMPREPRODDOCTORPORTAL_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: itelserver.azurecr.io
          registryUsername: ${{ secrets.PMPREPRODDOCTORPORTAL_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PMPREPRODDOCTORPORTAL_REGISTRY_PASSWORD }}
          containerAppName: pm-preprod-doctor-portal
          resourceGroup: tatva-prod
          imageToBuild: itelserver.azurecr.io/pm-preprod-doctor-portal:${{ github.sha }}

          buildArguments: |
            REACT_APP_ENV=prod
            GENERATE_SOURCEMAP=true
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
