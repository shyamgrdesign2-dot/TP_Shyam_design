name: Deactivate Old Revisions for Doctor Portal

on:
  workflow_dispatch:
    inputs:
      containerAppName:
        description: 'Azure Container App name'
        required: true
      resourceGroup:
        description: 'Azure Resource Group name'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Install Azure CLI and containerapp extension
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az extension add --name containerapp --yes || az extension update --name containerapp

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.PMPRODDOCTORPORTAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PMPRODDOCTORPORTAL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PMPRODDOCTORPORTAL_AZURE_SUBSCRIPTION_ID }}

      - name: Identify and deactivate old revisions
        run: |
          echo "🔍 Fetching all 0% traffic revisions (excluding those labeled 'blue')..."

          OLD_REVS=$(az containerapp revision list \
            --name ${{ github.event.inputs.containerAppName }} \
            --resource-group ${{ github.event.inputs.resourceGroup }} \
            --query "[?properties.trafficWeight == \`0\` && (properties.labels == null || length(properties.labels) == \`0\` || !contains(properties.labels[].label, 'blue'))].name" \
            -o tsv)

          if [ -z "$OLD_REVS" ]; then
            echo "✅ No old revisions found to deactivate."
          else
            for rev in $OLD_REVS; do
              echo "🔻 Deactivating: $rev"
              az containerapp revision deactivate \
                --name ${{ github.event.inputs.containerAppName }} \
                --resource-group ${{ github.event.inputs.resourceGroup }} \
                --revision $rev
            done
            echo "✅ Deactivation complete."
          fi